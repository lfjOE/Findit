<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="FindIt — Compara precios en Amazon, Walmart, AliExpress, Temu y más. Encuentra el mejor precio para lo que buscas.">
  <title>FindIt — Wish it. Search it. Find it</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">

</head>

<body class="bg-dark text-white">
  <nav class="navbar navbar-dark py-3 glass-nav fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fs-1 fw-bold" href="#">FindIt</a>
    </div>
  </nav>

  <main class="container" style="margin-top: 6rem;">
    <!-- Hero -->
    <div class="mb-4 hero-section">
      <h1 class="display-0">FindIt</h1>
      <p class="fs-5 fst-italic tagline d-inline-block p-2 px-3 rounded-pill text-light">Wish it. Search it. Find it</p>
    </div>

    <!-- Search -->
    <div class="mb-5 search-wrapper">
      <div class="col-md-8">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-transparent border-0 text-muted pe-0"
            style="position:absolute; left:16px; top:50%; transform:translateY(-50%); z-index:5; pointer-events:none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </span>
          <input type="text" id="search" class="form-control rounded-pill search-input"
            placeholder="¿Qué estás buscando?" required style="padding-left: 48px;">
        </div>
        <button id="find-button" class="btn btn-success rounded-pill ms-2 mt-3 fw-bold fs-4 px-4 py-2">Go and find
          it!</button>
      </div>
    </div>

    <!-- Stores -->
    <section class="mb-5 stores-section">
      <h2 class="display-5 mb-3 fw-bold">Store</h2>
      <div class="row g-4 justify-content-center custom-bg p-4 rounded-4 mt-3">
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Amazon">
            <img src="/res/amazon-com-logo.svg" class="stores logo-store mx-auto" alt="Amazon">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Walmart">
            <img src="/res/walmart-com-logo.svg" class="stores logo-store mx-auto" alt="Walmart">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Aliexpress">
            <img src="/res/aliexpress-com-logo.svg" class="stores logo-store mx-auto" alt="Aliexpress">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Temu">
            <img src="/res/temu-logo.svg" class="stores logo-store mx-auto" alt="Temu">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Nike">
            <img src="/res/nike-com-logo.svg" class="stores logo-store mx-auto" alt="Nike">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Adidas">
            <img src="/res/adidas-com-logo.svg" class="stores logo-store mx-auto" alt="Adidas">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Coppel">
            <img src="/res/coppel-logo.svg" class="stores logo-store mx-auto" alt="Coppel">
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="store-card card d-flex align-items-center justify-content-center p-3" role="button" tabindex="0"
            aria-label="Seleccionar Liverpool">
            <img src="/res/liverpool-logo.svg" class="stores logo-store mx-auto" alt="Liverpool">
          </div>
        </div>
      </div>
    </section>

    <!-- Specs / Price Filters -->
    <section class="mb-5 specs-section">
      <h2 class="display-5 mb-3 fw-bold">Specs</h2>
      <form class="row g-3 justify-content-center custom-bg p-4 rounded-4 mt-3" id="specs-form" autocomplete="off">
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center">
            <label for="minPrice" class="price-label mb-0 text-nowrap me-3">
              Más que
            </label>
            <div class="price-input-wrapper flex-grow-1">
              <span class="price-prefix">$</span>
              <input type="number" id="minPrice" class="form-control rounded-pill text-center price-input"
                placeholder="Precio mínimo" min="0">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center">
            <label for="maxPrice" class="price-label mb-0 text-nowrap me-3">
              Menos que
            </label>
            <div class="price-input-wrapper flex-grow-1">
              <span class="price-prefix">$</span>
              <input type="number" id="maxPrice" class="form-control rounded-pill text-center price-input"
                placeholder="Precio máximo" min="0">
            </div>
          </div>
        </div>

        <!-- Price validation error -->
        <div class="col-12">
          <div id="price-error" class="price-error">
            <span class="price-error-icon">⚠️</span>
            <span id="price-error-text"></span>
          </div>
        </div>
      </form>
    </section>
  </main>



  <section id="results" class="container mb-5 d-none results-section">
    <div class="results-header-wrapper">
      <div class="results-header text-center">
        <div class="results-icon-ring">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </div>
        <p class="results-subtitle">Resultados para</p>
        <h2 class="results-search-term" id="resultSearchTerm"></h2>
        <div class="results-divider"></div>
        <div class="results-meta">
          <div class="results-meta-group">
            <span class="results-meta-label">Tiendas</span>
            <div class="results-stores" id="resultStores"></div>
          </div>
          <div class="results-meta-group" id="resultPriceGroup" style="display:none;">
            <span class="results-meta-label">Rango de precio</span>
            <div class="results-price-range" id="resultPriceRange"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row justify-content-center cards">
      <div class="col-lg-10">
        <div class="card mb-4 p-4 result-card">
          <div class="row g-0 align-items-center">
            <div class="col-md-2">
              <img src="/res/gamerMouse.jpg" class="img-fluid rounded-start" alt="Alambric green gamer mouse"
                style="border-radius: 12px;">
            </div>
            <div class="col-md-7">
              <div class="card-body">
                <h3 class="card-title fw-bold fs-3">Alambric green gamer mouse</h3>
                <img src="/res/amazon-com-logo.svg" alt="Logo" class="img-fluid result-store-logo">
              </div>
            </div>
            <div class="col-md-3 text-center">
              <div class="badge fs-3 p-3 rounded-pill price-badge">
                $30.28
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>

</html>
